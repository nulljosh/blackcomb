<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" font-family="-apple-system,Helvetica,sans-serif" role="img" aria-label="Blackcomb architecture: screens, browser core and on-device state sit on WebKit; the landing page and Worker live outside the app">
<style>
.bg{fill:#fff}.box{fill:#f5f5f7;stroke:#d2d2d7;stroke-width:1.5}.web{fill:#0a5fd6}.out{fill:none;stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:6 5}
.h{fill:#0a5fd6;font-size:13px;font-weight:700;letter-spacing:.04em}.n{fill:#1d1d1f;font-size:13px;font-weight:600}.d{fill:#6e6e73;font-size:11.5px}
.w{fill:#fff;font-size:13px;font-weight:600}.ws{fill:#dbe8ff;font-size:11.5px}.a{stroke:#9ca3af;stroke-width:1.5;fill:none}.ah{fill:#9ca3af}
@media (prefers-color-scheme:dark){.bg{fill:#000}.box{fill:#1c1c1e;stroke:#38383a}.h{fill:#2997ff}.n{fill:#f5f5f7}.d{fill:#98989d}.web{fill:#2997ff}.w{fill:#04122b}.ws{fill:#0a2a5a}.out{stroke:#636366}}
</style>
<rect class="bg" width="800" height="490"/>
<rect class="box" x="30" y="30" width="230" height="236" rx="14"/><text class="h" x="46" y="56">Screens</text><text class="n" x="46" y="84">Views.swift</text><text class="d" x="46" y="100">chrome, tabs, find, settings</text><text class="n" x="46" y="120">Start.swift</text><text class="d" x="46" y="136">start page tiles</text><text class="n" x="46" y="156">Reader.swift</text><text class="d" x="46" y="172">reading list, read aloud</text><text class="n" x="46" y="192">Float.swift</text><text class="d" x="46" y="208">floating window (Mac)</text><text class="n" x="46" y="228">Pair.swift</text><text class="d" x="46" y="244">two pages in one (iOS)</text><rect class="box" x="285" y="30" width="230" height="236" rx="14"/><text class="h" x="301" y="56">Browser core</text><text class="n" x="301" y="84">BlackcombApp.swift</text><text class="d" x="301" y="100">window, menus, shortcuts</text><text class="n" x="301" y="120">Tabs (Browser.swift)</text><text class="d" x="301" y="136">restored at launch</text><text class="n" x="301" y="156">Page (Browser.swift)</text><text class="d" x="301" y="172">one WKWebView per tab</text><text class="n" x="301" y="192">resolve()</text><text class="d" x="301" y="208">text to URL or search</text><text class="n" x="301" y="228">Intents.swift</text><text class="d" x="301" y="244">Open in Blackcomb link</text><rect class="box" x="540" y="30" width="230" height="236" rx="14"/><text class="h" x="556" y="56">On this device</text><text class="n" x="556" y="84">Library.swift</text><text class="d" x="556" y="100">bookmarks, history, saved text</text><text class="n" x="556" y="120">Services.swift</text><text class="d" x="556" y="136">settings, tracker blocking</text><text class="n" x="556" y="156">SiteRules.swift</text><text class="d" x="556" y="172">zoom, dark, images, scripts</text><text class="n" x="556" y="192">Private tabs</text><text class="d" x="556" y="208">no history, own data store</text><text class="n" x="556" y="228">Automation.swift (Mac)</text><text class="d" x="556" y="244">MCP + REST on 127.0.0.1</text>
<path class="a" d="M260 148 H285 M515 148 H540"/><path class="ah" d="M285 148 l-7 -4 v8z M540 148 l-7 -4 v8z"/>
<path class="a" d="M145 266 V340 M400 266 V340 M655 266 V340"/><path class="ah" d="M145 340 l-4 -7 h8z M400 340 l-4 -7 h8z M655 340 l-4 -7 h8z"/>
<rect class="web" x="30" y="340" width="740" height="56" rx="14"/>
<text class="w" x="400" y="364" text-anchor="middle">WebKit</text><text class="ws" x="400" y="383" text-anchor="middle">rendering, JavaScript, cookies, networking, content rule lists. Blackcomb writes none of it.</text>
<rect class="out" x="30" y="422" width="740" height="54" rx="14"/>
<text class="n" x="46" y="446">Landing (Cloudflare Worker, not in the app)</text><text class="d" x="46" y="464">index.html demo, start.html, /go frame proxy, /api/search, privacy and support pages</text>
</svg>

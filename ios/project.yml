name: Blackcomb
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202610181830"
targets:
  Blackcomb:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Icon Composer document, Liquid Glass layers. AppIcon.appiconset stays as the flat fallback.
      - path: Blackcomb.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.lucarne
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Blackcomb
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Blackcomb.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Blackcomb-macOS.entitlements
  BlackcombTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Blackcomb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.lucarne.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Blackcomb.app/Contents/MacOS/Blackcomb
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Blackcomb:
    build:
      targets:
        Blackcomb: all
        BlackcombTests: [test]
    test:
      targets:
        - BlackcombTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true

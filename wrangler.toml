name = "madobe"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./landing"
binding = "ASSETS"
run_worker_first = ["/go"]

# The Worker keeps its first name; the app is Blackcomb. Old hosts stay so links keep working.
[[routes]]
pattern = "blackcomb.jaybulb.com"
custom_domain = true

[[routes]]
pattern = "madobe.jaybulb.com"
custom_domain = true

[[routes]]
pattern = "madobe.heyitsmejosh.com"
custom_domain = true
